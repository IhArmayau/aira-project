<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA - Al-Gaddaf Technology Hub (Genius Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for Mathematical Equations -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Mermaid.js for Diagrams & Flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
    <style>
        @keyframes avatar-pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(34, 197, 94, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        }
        .speaking-active {
            animation: avatar-pulse 1.2s infinite ease-in-out !important;
            border-color: #22c55e !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between font-sans">
    
    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <div>
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                AIRA <span class="text-xs bg-purple-600 px-2 py-0.5 rounded text-white font-normal">Super Engine</span>
            </h1>
            <p class="text-xs text-gray-400">Al-Gaddaf Technology Hub</p>
        </div>
        <div class="flex items-center gap-3">
            <button id="clear-history-btn" class="text-xs bg-red-600/80 hover:bg-red-700 text-white px-2.5 py-1 rounded transition" title="Goge Tarihin Hira">
                Sabon Zance 🗑️
            </button>
            <span class="text-xs bg-green-600 text-white px-2 py-1 rounded-full animate-pulse flex items-center gap-1">
                <span class="w-2 h-2 bg-white rounded-full"></span> Online
            </span>
        </div>
    </header>

    <!-- Holographic Avatar Banner -->
    <div class="bg-gray-800/90 border-b border-gray-700 py-4 px-4 flex flex-col items-center justify-center relative overflow-hidden">
        <div id="avatar-core" class="w-20 h-20 rounded-full border-4 border-cyan-400 bg-gradient-to-tr from-cyan-500 via-purple-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 transition-all duration-300">
            <span class="text-2xl font-black text-white tracking-widest drop-shadow-md">AIRA</span>
        </div>
        <div id="voice-status" class="mt-3 text-xs text-cyan-300 font-semibold flex items-center gap-2 hidden">
            <span class="flex gap-1 items-end h-3">
                <span class="w-1 bg-cyan-400 h-2 animate-bounce"></span>
                <span class="w-1 bg-cyan-400 h-3 animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-1 bg-cyan-400 h-1 animate-bounce [animation-delay:0.4s]"></span>
            </span>
            <span>AIRA tana magana...</span>
        </div>
    </div>

    <!-- Chat Messages -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
        <div class="flex justify-start">
            <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow-md">
                <p>Sannu! Ni ce <strong>AIRA</strong>, babban injin fasahar zamani da warware matsaloli daga Al-Gaddaf Technology Hub. Yanzu ina da ƙarin ƙarfin gudanar da lamba, zane-zane, da muryar zamani. Me zan iya taimaka maka da shi yau?</p>
            </div>
        </div>
    </div>

    <!-- Uploaded File Preview Badge -->
    <div id="file-preview" class="max-w-3xl mx-auto w-full px-4 hidden">
        <div class="bg-gray-800 border border-gray-700 text-cyan-300 px-3 py-1.5 rounded-lg text-xs flex items-center justify-between">
            <span id="file-name" class="truncate max-w-xs"></span>
            <button type="button" id="remove-file-btn" class="text-red-400 hover:text-red-300 font-bold ml-2">✕</button>
        </div>
    </div>

    <!-- Input Form -->
    <div class="bg-gray-800 p-4 border-t border-gray-700">
        <form id="chat-form" class="max-w-3xl mx-auto flex items-center gap-2">
            <!-- File Upload Button -->
            <label for="file-input" class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-cyan-400 p-2.5 rounded-lg border border-gray-600 flex items-center justify-center transition" title="Loda PDF ko Hoto">
                📎
            </label>
            <input type="file" id="file-input" class="hidden" accept=".pdf,image/*">

            <!-- Mic Input Button -->
            <button type="button" id="mic-btn" class="bg-gray-700 hover:bg-gray-600 text-yellow-400 p-2.5 rounded-lg border border-gray-600 flex items-center justify-center transition" title="Yi Magana da Baki">
                🎙️
            </button>

            <!-- Text Input -->
            <input type="text" id="user-input" placeholder="Tambayi AIRA ko ka rubuta lamba (Code/Bug) a nan..." class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm border border-gray-600 placeholder-gray-400">
            
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold transition text-sm">Aika</button>
        </form>
    </div>

    <script>
        const API_URL = "https://aira-project-q0iz.onrender.com";
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const avatarCore = document.getElementById('avatar-core');
        const voiceStatus = document.getElementById('voice-status');
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const fileNameSpan = document.getElementById('file-name');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const micBtn = document.getElementById('mic-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        let chatHistory = JSON.parse(localStorage.getItem('aira_history')) || [];
        let selectedFile = null;

        // Render Saved History on Load
        function renderHistory() {
            if (chatHistory.length > 0) {
                chatContainer.innerHTML = '';
                chatHistory.forEach(msg => {
                    const isUser = msg.role === 'user';
                    const div = document.createElement('div');
                    div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                    
                    if (isUser) {
                        div.innerHTML = `<div class="bg-blue-600 p-3 rounded-lg max-w-lg text-sm shadow"><p>${msg.content}</p></div>`;
                    } else {
                        div.innerHTML = `
                            <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow space-y-2">
                                <div>${msg.content}</div>
                                <div class="pt-2 border-t border-gray-700/50 flex justify-end">
                                    <button class="voice-btn text-xs bg-gray-700 hover:bg-gray-600 text-cyan-400 px-2 py-1 rounded flex items-center gap-1 transition">
                                        🔊 Kunna Murya
                                    </button>
                                </div>
                            </div>
                        `;
                        div.querySelector('.voice-btn').addEventListener('click', () => playBrowserVoice(msg.content));
                    }
                    chatContainer.appendChild(div);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }
        renderHistory();

        // Clear History
        clearHistoryBtn.addEventListener('click', () => {
            if (confirm("Kuna son share duk tarihin wannan hirar?")) {
                localStorage.removeItem('aira_history');
                chatHistory = [];
                chatContainer.innerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow-md">
                            <p>An share tsohuwar hira. Me zan iya taimaka maka da shi yau?</p>
                        </div>
                    </div>
                `;
            }
        });

        // Handle File Selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameSpan.textContent = `📁 Fayil: ${selectedFile.name}`;
                filePreview.classList.remove('hidden');
            }
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            filePreview.classList.add('hidden');
        });

        // Speech-to-Text (Mic Feature)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('bg-red-600');
            });

            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
                micBtn.classList.remove('bg-red-600');
            };

            recognition.onerror = () => micBtn.classList.remove('bg-red-600');
            recognition.onend = () => micBtn.classList.remove('bg-red-600');
        } else {
            micBtn.style.display = 'none';
        }

        // Improved Browser Speech Synthesis (Female Voice & Clear Audio)
        function playBrowserVoice(rawHtml) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let tmp = document.createElement("DIV");
            tmp.innerHTML = rawHtml;
            let plainText = (tmp.textContent || tmp.innerText || "").replace(/[\n\r]+/g, ' ').trim();
            if (!plainText) return;

            const utterance = new SpeechSynthesisUtterance(plainText);
            const isEnglish = /^[A-Za-z0-9\s.,!?-]+$/.test(plainText.slice(0, 20));
            utterance.lang = isEnglish ? 'en-US' : 'ha-NG';
            
            // Gyara sauri da kuma sautin muryar domin ta fi fitowa da kyau (muryar mace)
            utterance.rate = 1.0;
            utterance.pitch = 1.3;

            // Zaɓar muryar mace da ke cikin na'urar ta atomatik
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
                (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('susan') || v.name.toLowerCase().includes('victoria'))
            );
            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }

            utterance.onstart = () => {
                avatarCore.classList.add('speaking-active');
                voiceStatus.classList.remove('hidden');
            };

            utterance.onend = () => {
                avatarCore.classList.remove('speaking-active');
                voiceStatus.classList.add('hidden');
            };

            utterance.onerror = () => {
                avatarCore.classList.remove('speaking-active');
                voiceStatus.classList.add('hidden');
            };

            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Code execution simulation or copy toolbar injector
        function enhanceCodeBlocks(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-toolbar')) return;
                const toolbar = document.createElement('div');
                toolbar.className = 'code-toolbar flex justify-between items-center bg-gray-800 px-3 py-1 text-xs border-b border-gray-700 text-gray-300';
                
                const langSpan = document.createElement('span');
                langSpan.textContent = 'Code Snippet';
                
                const btnGroup = document.createElement('div');
                btnGroup.className = 'flex gap-2';

                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy 📋';
                copyBtn.className = 'hover:text-cyan-400 transition';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(pre.querySelector('code').innerText);
                    copyBtn.textContent = 'Copied! ✅';
                    setTimeout(() => copyBtn.textContent = 'Copy 📋', 2000);
                };

                btnGroup.appendChild(copyBtn);
                toolbar.appendChild(langSpan);
                toolbar.appendChild(btnGroup);
                pre.insertBefore(toolbar, pre.firstChild);
            });
        }

        // Form Submit Event
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text && !selectedFile) return;

            let userMsgHtml = `<p>${text}</p>`;
            if (selectedFile) {
                userMsgHtml += `<div class="mt-1 text-xs text-cyan-200">📎 Attached: ${selectedFile.name}</div>`;
            }

            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 p-3 rounded-lg max-w-lg text-sm shadow">
                        ${userMsgHtml}
                    </div>
                </div>
            `;
            
            const fileToSend = selectedFile;
            userInput.value = '';
            selectedFile = null;
            fileInput.value = '';
            filePreview.classList.add('hidden');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let response, data;
                if (fileToSend) {
                    const formData = new FormData();
                    formData.append('message', text);
                    formData.append('file', fileToSend);
                    response = await fetch(`${API_URL}/api/chat/multimodal`, { method: 'POST', body: formData });
                } else {
                    response = await fetch(`${API_URL}/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, history: chatHistory })
                    });
                }

                data = await response.json();
                const botReply = data.reply || "An samu matsala wajen samun amsa daga sabar.";

                const msgDiv = document.createElement("div");
                msgDiv.className = "flex justify-start";
                msgDiv.innerHTML = `
                    <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow space-y-2">
                        <div>${botReply}</div>
                        <div class="pt-2 border-t border-gray-700/50 flex justify-end">
                            <button class="voice-btn text-xs bg-gray-700 hover:bg-gray-600 text-cyan-400 px-2 py-1 rounded flex items-center gap-1 transition">
                                🔊 Kunna Murya
                            </button>
                        </div>
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
                enhanceCodeBlocks(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                msgDiv.querySelector('.voice-btn').addEventListener('click', () => playBrowserVoice(botReply));

                chatHistory.push({ role: "user", content: text || "Uploaded file analysis" });
                chatHistory.push({ role: "assistant", content: botReply });
                localStorage.setItem('aira_history', JSON.stringify(chatHistory));

                playBrowserVoice(botReply);

            } catch (err) {
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-600/80 border border-red-500 p-3 rounded-lg max-w-lg text-sm">
                            <p>An samu kuskure wajen haɗa sadarwa da sabar.</p>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
