<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA Genius - Al-Gaddaf Technology Hub</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-avatar-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between font-sans">
    
    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <div>
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                AIRA 
                <span class="text-xs bg-purple-600 px-2 py-0.5 rounded text-white font-normal">Genius v2.0.4</span>
            </h1>
            <p class="text-xs text-gray-400">Al-Gaddaf Technology Hub</p>
        </div>
        <span class="text-xs bg-green-600 text-white px-2 py-1 rounded-full animate-pulse flex items-center gap-1">
            <span class="w-2 h-2 bg-white rounded-full"></span> Online
        </span>
    </header>

    <!-- AIRA Interactive Animated Avatar Component Header -->
    <div class="bg-gray-800/80 border-b border-gray-700 py-3 px-4 flex flex-col items-center justify-center relative overflow-hidden">
        <div class="relative flex items-center justify-center">
            <!-- Outer Glow / Visualizer Ring -->
            <div id="avatar-ring" class="absolute w-24 h-24 rounded-full bg-cyan-500/20 border-2 border-cyan-400/50 hidden animate-avatar-ring"></div>
            
            <!-- Avatar Frame -->
            <div id="avatar-container" class="relative w-20 h-20 rounded-full border-2 border-cyan-400 overflow-hidden shadow-lg shadow-cyan-500/30 transition-transform duration-300">
                <!-- AIRA Holographic Avatar Image -->
                <img id="aira-avatar-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80" alt="AIRA Avatar" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Animated Voice Status & Waves -->
        <div id="voice-status" class="mt-2 text-xs text-cyan-300 font-semibold flex items-center gap-2 hidden">
            <span class="flex gap-1 items-end h-3">
                <span class="w-1 bg-cyan-400 h-2 animate-bounce"></span>
                <span class="w-1 bg-cyan-400 h-3 animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-1 bg-cyan-400 h-1 animate-bounce [animation-delay:0.4s]"></span>
            </span>
            <span>AIRA tana magana...</span>
        </div>
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
        <div class="flex justify-start">
            <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow-md">
                <p>Sannu! Ni ce <strong>AIRA</strong> (Genius Edition), abokiyar aikinka ta fasahar zamani daga Al-Gaddaf Technology Hub. Me zan iya taimaka maka da shi yau?</p>
            </div>
        </div>
    </div>

    <!-- Input Form Area -->
    <div class="bg-gray-800 p-4 border-t border-gray-700">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Rubuta tambayarka anan..." class="flex-1 bg-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm border border-gray-600">
            <button type="submit" class="bg-blue-600 px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition text-sm flex items-center gap-1">
                <span>Aika</span>
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "https://aira-project-q0iz.onrender.com";
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        
        const avatarContainer = document.getElementById('avatar-container');
        const avatarRing = document.getElementById('avatar-ring');
        const voiceStatus = document.getElementById('voice-status');

        let chatHistory = [];

        // Function to synthesize voice & animate avatar
        async function playVoice(text) {
            try {
                const formData = new FormData();
                formData.append("text", text);

                const res = await fetch(`${API_URL}/api/voice`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) return;

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);

                audio.onplay = () => {
                    avatarContainer.classList.add('scale-110', 'border-green-400', 'shadow-green-500/50');
                    avatarRing.classList.remove('hidden');
                    voiceStatus.classList.remove('hidden');
                };

                audio.onended = () => {
                    avatarContainer.classList.remove('scale-110', 'border-green-400', 'shadow-green-500/50');
                    avatarRing.classList.add('hidden');
                    voiceStatus.classList.add('hidden');
                };

                audio.play();
            } catch (err) {
                console.log("Voice generation skipped or unavailable.");
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Display user message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 p-3 rounded-lg max-w-lg text-sm shadow">
                        <p>${text}</p>
                    </div>
                </div>
            `;
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });
                const data = await response.json();
                const botReply = data.reply || "An samu matsala wajen samun amsa daga sabar.";

                // Sanitize HTML display
                const msgId = "msg-" + Date.now();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-gray-800 border border-gray-700 p-3 rounded-lg max-w-lg text-sm leading-relaxed shadow space-y-2">
                            <div>${botReply}</div>
                            <div class="pt-2 border-t border-gray-700/50 flex justify-end">
                                <button onclick="playVoice('${text.replace(/'/g, "\\'")}')" class="text-xs bg-gray-700 hover:bg-gray-600 text-cyan-400 px-2 py-1 rounded flex items-center gap-1 transition">
                                    🔊 Kunna Murya
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;

                chatHistory.push({ role: "user", content: text });
                chatHistory.push({ role: "assistant", content: botReply });

                // Auto-speak reply
                playVoice(botReply);

            } catch (err) {
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-600/80 border border-red-500 p-3 rounded-lg max-w-lg text-sm">
                            <p>An samu kuskure wajen haɗa sadarwa da sabar.</p>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
